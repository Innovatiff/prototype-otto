# XcodeGen manifest — generates Otto.xcodeproj (which is gitignored):
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open Otto.xcodeproj
#
# Re-run `xcodegen generate` after adding/removing files (including after
# `npm run codegen` adds a NEW file to Otto/Models, and after placing
# GoogleService-Info.plist).
name: Otto
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0

schemes:
  Otto:
    build:
      targets:
        Otto: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OttoTests

targets:
  Otto:
    type: application
    platform: iOS
    sources:
      # Everything under Otto/, including generated Models/ and (once you drop
      # it in) GoogleService-Info.plist, which XcodeGen adds as a resource.
      - path: Otto
        excludes:
          - Info.plist
    # A real (generated, gitignored) Info.plist instead of INFOPLIST_KEY_
    # build settings: UIBackgroundModes is an array those keys can't express,
    # and Step 7's HealthKit strings land here too.
    info:
      path: Otto/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Guided sessions keep the audio session live and speak cues with the
        # screen locked — a workout timer that dies mid-set is useless. Otto
        # genuinely plays audio for the whole session, which is the
        # legitimate, App Store-compliant use of this mode. `fetch` powers
        # the daily background calendar-view refresh (BGAppRefreshTask).
        UIBackgroundModes: [audio, fetch]
        # The background calendar refresh task; must match
        # CalendarSyncService.backgroundTaskId.
        BGTaskSchedulerPermittedIdentifiers: [com.alamfernandez.otto.calendar-refresh]
        NSMicrophoneUsageDescription: "Otto listens so you can talk to it."
        NSSpeechRecognitionUsageDescription: "Otto transcribes your speech on this device to understand you."
        # Required for a physical device to reach the dev server on the Mac's
        # LAN IP — without it iOS denies local-network connections outright.
        NSLocalNetworkUsageDescription: "Otto connects to your development server on your local network."
        NSContactsUsageDescription: "Otto looks up the person you name so you can text them."
        NSCalendarsFullAccessUsageDescription: "Otto reads your calendar to prepare your day and flag conflicts, and adds events only when you confirm them."
        NSHealthShareUsageDescription: "Otto reads your workouts, active energy, body mass, sleep, and steps to personalize your training plans and daily briefings. Health data stays on this device and is never stored on Otto's servers."
        NSHealthUpdateUsageDescription: "Otto saves your completed guided workouts to Health so your activity history stays complete."
    # HealthKit capability (unblocked by the developer program). The
    # entitlements file is generated alongside the project, like Info.plist.
    entitlements:
      path: Otto/Otto.entitlements
      properties:
        com.apple.developer.healthkit: true
        # DELIBERATELY ABSENT: aps-environment. With the Push capability
        # declared in SystemCapabilities below, Xcode's automatic signing
        # injects aps-environment itself at signing time; declaring it
        # here as well is what trips the capability mapper ("PUSH_
        # NOTIFICATIONS could not be determined").
        # DELIBERATELY ABSENT: com.apple.developer.usernotifications.time-sensitive.
        # Xcode's automatic signing cannot map that entitlement from a
        # file-based .entitlements ("USERNOTIFICATIONS_TIMESENSITIVE could
        # not be determined") and aborts the WHOLE profile update, taking
        # Push down with it. Everything degrades gracefully without it:
        # iOS silently delivers our time-sensitive-labeled notifications
        # (meeting prep pushes, the guidance backstop) at normal priority.
        # Re-add if a future Xcode fixes the capability mapping.
    # The same project attributes Xcode's "+ Capability" button writes.
    # Automatic signing's capability mapper reads THESE, not just the
    # entitlements file — without them it can fail with "the capability
    # associated with PUSH_NOTIFICATIONS could not be determined".
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
        com.apple.HealthKit:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseMessaging
    settings:
      base:
        # Matches the iOS app registered in the Firebase console
        # (GoogleService-Info.plist BUNDLE_ID). Change both together.
        PRODUCT_BUNDLE_IDENTIFIER: com.alamfernandez.otto
        PRODUCT_NAME: Otto
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1

        SWIFT_VERSION: "6.0"
        # REQUIRED by the generated models in Otto/Models (see their headers):
        # under MainActor-by-default isolation their Codable conformances
        # cannot compile. Do not flip this to MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

        # The paid Apple Developer Program team — REQUIRED for the push,
        # time-sensitive, and HealthKit entitlements (the free personal team
        # cannot sign them). The matching Apple ID must be signed into
        # Xcode → Settings → Accounts.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TSZLLRZJXH
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: NO

  OttoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # ClauseBufferVectors.json rides along as a test-bundle resource.
      - path: OttoTests
    dependencies:
      # XcodeGen wires TEST_HOST/BUNDLE_LOADER from this app dependency.
      - target: Otto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alamfernandez.otto.tests
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: TSZLLRZJXH
